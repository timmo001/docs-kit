min_version = "2025.1.0"

[tools]
node = "26.13.0"
bun = "1.4.4"
# The linters the shared hk pre-push hook runs, matching CI.
uv = "0.13.6"
# yamllint's PyYAML has no wheels for newer Pythons, and mise won't build it from source.
python = "3.15.2"
"pipx:yamllint" = "1.38.0"
"npm:markdownlint-cli2" = "0.24.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.install]
description = "Install dependencies"
run = "bun install --frozen-lockfile"

[tasks.lint]
description = "Lint every package with the shared Oxlint rules"
depends = ["install"]
run = "bun run --filter './packages/*' lint"

[tasks.typecheck]
description = "Type-check every package"
depends = ["install"]
run = "bun run --filter './packages/*' typecheck"

[tasks.format]
description = "Format every package"
depends = ["install"]
run = "bun run --filter './packages/*' format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
run = "bun run --filter './packages/*' format:check"

[tasks.check]
description = "Lint, type-check and verify formatting"
depends = ["lint", "typecheck", "format:check"]
